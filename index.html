<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101629"><title>StudyPilot AI — Study smarter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#0b1020;--panel:#131a2c;--line:#28334b;--muted:#929db4;--purple:#9382ff;--green:#69d7b5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f4fb;font:14px 'DM Sans',sans-serif}.layout{display:flex;min-height:100vh}.side{width:235px;background:#101629;border-right:1px solid #202941;padding:26px 18px;display:flex;flex-direction:column}.brand{font:700 22px 'Space Grotesk';margin:4px 8px 42px}.brand span{color:#a99cff}.tag{color:#7f89a2;font-size:10px;letter-spacing:1.5px;margin:0 10px 12px}.nav button{display:block;width:100%;text-align:left;padding:13px;border:0;border-radius:9px;background:transparent;color:#a5aec2;margin:4px 0;font-weight:600}.nav button.active,.nav button:hover{background:#29264c;color:#c5bbff}.side-note{margin-top:auto;padding:15px;background:#222142;border:1px solid #39365f;border-radius:12px;color:#c5c0ed;line-height:1.6}.side-note small{color:#a6a9c0}.main{flex:1;min-width:0}.top{height:66px;border-bottom:1px solid #202941;display:flex;align-items:center;justify-content:space-between;padding:0 36px;color:#a5aec2}.content{max-width:1250px;padding:34px 36px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:23px}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#a99cff;font-weight:700}.h1{font:600 29px 'Space Grotesk';margin:8px 0}.sub{color:var(--muted);font-size:12px}.btn{border:0;border-radius:9px;background:linear-gradient(110deg,#8978f5,#6553ce);color:white;padding:11px 16px;font-weight:700;cursor:pointer}.hero{padding:27px 30px;border:1px solid #39365f;border-radius:16px;background:radial-gradient(ellipse at 80%,#39356c,#1b203b 65%);margin-bottom:18px}.hero h2{font:700 29px 'Space Grotesk';margin:10px 0}.hero h2 span{color:#b1a5ff}.hero p{color:#b4bad0;max-width:520px;line-height:1.6}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:17px}.stat small{color:var(--muted)}.stat strong{display:block;font:600 25px 'Space Grotesk';margin:9px 0 3px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}.panel h3{font:600 15px 'Space Grotesk';margin:0 0 5px}.panel>p{color:var(--muted);font-size:11px}.task{display:flex;align-items:center;gap:10px;padding:13px 0;border-top:1px solid var(--line)}.task input{accent-color:#8d7cf6;width:17px;height:17px}.task div{flex:1;min-width:0}.task b{display:block;font-size:12px}.task small{color:var(--muted);font-size:10px}.task.done b{text-decoration:line-through;color:#778199}.date{font-size:10px;color:#b7adff}.empty{padding:24px 0;color:var(--muted);font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.list{margin-top:13px}.field{display:grid;gap:6px;margin:12px 0;color:#b9c1d2;font-size:11px}.field input,.field select{background:#0d1425;border:1px solid #3a4560;color:white;border-radius:8px;padding:11px}.modal{display:none;position:fixed;inset:0;background:#050813d9;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(430px,100%);background:#171f33;border:1px solid #3a4560;border-radius:14px;padding:22px}.dialog h3{margin:0 0 15px;font:600 18px 'Space Grotesk'}.actions{display:flex;gap:8px;justify-content:end;margin-top:18px}.secondary{background:#303950;color:#dce0eb}.plan-item{padding:12px 0;border-top:1px solid var(--line);display:flex;gap:12px}.plan-item b{font-size:12px}.plan-item small{display:block;color:var(--muted);margin-top:4px}.pill{font-size:10px;color:#a99cff;background:#302b53;padding:5px 8px;border-radius:6px}@media(max-width:850px){.side{width:190px}.content{padding:25px 20px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.layout{display:block}.side{width:auto;padding:12px 14px;display:block}.brand{margin:4px 5px 12px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;width:auto;padding:9px 11px;font-size:11px}.tag,.side-note{display:none}.top{height:48px;padding:0 17px}.content{padding:22px 15px}.head{align-items:start;flex-direction:column;gap:13px}.head .btn{width:100%}.hero{padding:22px}.hero h2{font-size:25px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:22px}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">study<span>pilot</span> <sup style="font-size:9px;color:#9382ff">AI</sup></div><div class="tag">WORKSPACE</div><nav class="nav"><button class="active" data-page="Overview">◈ Overview</button><button data-page="Tasks">✓ My Tasks</button><button data-page="Planner">✧ AI Planner</button><button data-page="Subjects">▤ Subjects</button></nav><div class="side-note"><b>Make every hour count.</b><br><small>Build a focused plan and keep moving towards your goals.</small></div></aside><main class="main"><header class="top"><span>Workspace / <b id="crumb">Overview</b></span><span id="today"></span></header><div class="content"><div class="head"><div><div class="eyebrow">YOUR PERSONAL STUDY SPACE</div><h1 class="h1" id="title">Your learning, in focus</h1><div class="sub">A little progress each day adds up to big results.</div></div><button class="btn" id="addBtn">＋ Add new task</button></div><section id="view"></section></div></main></div><div class="modal" id="modal"><form class="dialog" id="taskForm"><h3>Create a study task</h3><label class="field">Task title<input id="taskTitle" required placeholder="e.g. Revise chapter 3"></label><label class="field">Subject<input id="taskSubject" placeholder="e.g. Mathematics"></label><label class="field">Deadline<input id="taskDate" type="date" required></label><label class="field">Estimated hours<input id="taskHours" type="number" min=".5" max="20" step=".5" value="1.5"></label><div class="actions"><button type="button" class="btn secondary" id="cancel">Cancel</button><button class="btn">Save task</button></div></form></div><script>
const $=s=>document.querySelector(s);let tasks=JSON.parse(localStorage.getItem('sp_tasks')||'[]'),page='Overview',plan=[];const today=new Date().toISOString().slice(0,10);$('#today').textContent=new Date().toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'});$('#taskDate').min=today;
function save(){localStorage.setItem('sp_tasks',JSON.stringify(tasks));render()}function doneCount(){return tasks.filter(t=>t.done).length}function taskHtml(t,i){return '<div class="task '+(t.done?'done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggle('+i+')"><div><b>'+esc(t.title)+'</b><small>'+esc(t.subject||'General')+' · '+t.hours+'h</small></div><span class="date">'+new Date(t.date+'T00:00:00').toLocaleDateString('en',{month:'short',day:'numeric'})+'</span></div>'}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.toggle=i=>{tasks[i].done=!tasks[i].done;save()};
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=page;$('#title').textContent=page==='Overview'?'Your learning, in focus':page==='Planner'?'Your intelligent study plan':page==='Tasks'?'All study tasks':'Your subjects';$('#addBtn').style.display=page==='Subjects'?'none':'block';let pending=tasks.filter(t=>!t.done),subjects=[...new Set(tasks.map(t=>t.subject).filter(Boolean))];let html='';if(page==='Overview'){html='<div class="hero"><div class="eyebrow">✧ YOUR STUDY COMPANION</div><h2>Study smarter.<br><span>Not just harder.</span></h2><p>Turn your goals into a clear plan. Organize your tasks, track progress and make every study session count.</p><button class="btn" onclick="setPage(&quot;Planner&quot;)">Build my study plan ↗</button></div><div class="stats"><div class="stat"><small>Total subjects</small><strong>'+subjects.length+'</strong><small>Keep learning</small></div><div class="stat"><small>Tasks completed</small><strong>'+doneCount()+'</strong><small>'+(tasks.length?Math.round(doneCount()/tasks.length*100):0)+'% completion</small></div><div class="stat"><small>Study hours</small><strong>'+tasks.filter(t=>t.done).reduce((a,t)=>a+Number(t.hours),0)+'h</strong><small>Completed task estimates</small></div><div class="stat"><small>Tasks to go</small><strong>'+pending.length+'</strong><small>You have got this</small></div></div><div class="grid"><div class="panel"><div class="row"><h3>Upcoming tasks</h3><span class="pill">'+pending.length+' pending</span></div><p>Your next steps to success</p><div class="list">'+(pending.length?pending.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5).map(t=>taskHtml(t,tasks.indexOf(t))).join(''):'<div class="empty">No pending tasks. Add one to get started!</div>')+'</div></div><div class="panel"><h3>Study progress</h3><p>Your learning journey at a glance</p><div style="font:600 42px Space Grotesk;color:#a99cff;margin:25px 0 6px">'+(tasks.length?Math.round(doneCount()/tasks.length*100):0)+'%</div><div class="sub">Overall completion</div><div style="height:8px;background:#29334b;border-radius:9px;margin:14px 0"><div style="height:8px;width:'+(tasks.length?doneCount()/tasks.length*100:0)+'%;background:#8f7df5;border-radius:9px"></div></div><div class="sub">'+doneCount()+' of '+tasks.length+' tasks completed</div></div></div>'}else if(page==='Tasks'){html='<div class="panel"><div class="row"><h3>All study tasks</h3><span class="pill">'+pending.length+' pending</span></div><div class="list">'+(tasks.length?tasks.map((t,i)=>taskHtml(t,i)).join(''):'<div class="empty">No tasks yet. Add your first study task.</div>')+'</div></div>'}else if(page==='Subjects'){html='<div class="panel"><h3>Your subjects</h3><p>Subjects are created automatically when you add a task.</p><div class="list">'+(subjects.length?subjects.map((s,i)=>'<div class="task"><div><b>'+esc(s)+'</b><small>'+tasks.filter(t=>t.subject===s).length+' study tasks</small></div><span class="pill">0'+(i+1)+'</span></div>').join(''):'<div class="empty">Add a task and assign it to a subject to get started.</div>')+'</div></div>'}else{html='<div class="panel" style="margin-bottom:15px"><div class="eyebrow">PERSONALIZE YOUR PLAN</div><h3 style="margin-top:8px">How much time can you study each day?</h3><p>Generate a 7-day schedule based on deadlines, difficulty and estimated effort.</p><div class="row" style="margin:20px 0"><input id="hours" type="range" min="1" max="8" value="3" style="accent-color:#9382ff;flex:1"><b id="hourLabel">3 hours / day</b></div><button class="btn" onclick="generate()">✧ Generate my plan</button></div><div class="panel"><h3>Your weekly schedule</h3><div class="list">'+(plan.length?plan.map(p=>'<div class="plan-item"><span class="pill">'+p.day+'</span><div><b>'+esc(p.title)+'</b><small>'+esc(p.subject)+' · '+p.time+' · '+p.hours+'h</small></div></div>').join(''):'<div class="empty">Your personalized study blocks will appear here after generation.</div>')+'</div></div>'}$('#view').innerHTML=html;let h=$('#hours');if(h)h.oninput=()=>$('#hourLabel').textContent=h.value+' hours / day'}
function setPage(p){page=p;render()}window.setPage=setPage;function generate(){let hrs=Number($('#hours')?.value||3),remaining=tasks.filter(t=>!t.done).map(t=>({...t,left:Number(t.hours)})).sort((a,b)=>a.date.localeCompare(b.date));plan=[];for(let d=0;d<7;d++){let cap=hrs,slot=5;for(let t of remaining){if(cap<.5||t.left<.5)continue;let n=Math.min(1.5,cap,t.left);plan.push({day:new Date(Date.now()+d*86400000).toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'}),title:t.title,subject:t.subject||'General',time:new Date(2000,0,1,slot).toLocaleTimeString('en',{hour:'numeric'}),hours:n});t.left-=n;cap-=n;slot+=Math.ceil(n)}}render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#addBtn').onclick=()=>$('#modal').classList.add('open');$('#cancel').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('open')};$('#taskForm').onsubmit=e=>{e.preventDefault();tasks.push({title:$('#taskTitle').value,subject:$('#taskSubject').value,date:$('#taskDate').value,hours:Number($('#taskHours').value),done:false});e.target.reset();$('#taskHours').value=1.5;$('#taskDate').min=today;$('#modal').classList.remove('open');save()};render();
</script></body></html>
